spring:
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/javi}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  ai:
    openai:
      api-key: ${GEMINI_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com
        completions-path: /v1beta/openai/chat/completions
        options:
          model: gemini-3.5-flash
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${JAVI_EMAIL:dummy-email@gmail.com}
    password: ${APP_PASSWORD:dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          ssl.trust: smtp.gmail.com #tạm thời để chạy được gửi email trên local

  mvc:
    async:
      request-timeout: 60s

server:
  forward-headers-strategy: native
  netty:
    connection-timeout: 60s


javi:
#  upload-file:
#    base-uri: file:///D:/Javi-dictionary/upload/
  max-size-image-translate: 4194304  #4MB
  max-avatar-size: 5242880 # 5MB
  max-kanji-gif-size: 10485760 #10MB

api:
  prefix: /api/v1

jwt:
  signerKey: ${JWT_KEY} #base64
  valid-duration: 900 # in second (15 phút)
  refreshable-duration: 1209600 # in seconds (14 ngày)

google:
  client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
    #  redirect-uri: http://localhost:5173/auth/google/callback
  redirect-uri: ${GOOGLE_REDIRECT_URI:https://javi.click/api/v1/auth/google/callback}
  translate:
    base-url: https://translate.googleapis.com/translate_a/single
  vision:
    api-key: ${GOOGLE_CLOUD_API_KEY:dummy-vision-key}

app:
  time-zone: Asia/Ho_Chi_Minh
  verification:
    token-expiration-minutes: 10
    reset-password-token-expiration-minutes: 10
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:${APP_FRONTEND_BASE-URL:https://javi.click}}
cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:dummy-account-id}
    access-key: ${R2_ACCESS_KEY_ID:dummy-access-key}
    secret-key: ${R2_SECRET_KEY:dummy-secret-key}
    bucket: "javi-avatar"
    endpoint: ${R2_ENDPOINT:https://dummy-endpoint.r2.dev}
    public-base-url: "https://pub-a426002f5fad4ea3b8229f3e7d166a74.r2.dev"